apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-retail-pod-discovery
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-retail-pod-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-retail-pod-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
