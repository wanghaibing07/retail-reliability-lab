apiVersion: v1
kind: Namespace
metadata:
  name: retail-registry
  labels:
    app.kubernetes.io/name: retail-registry
    app.kubernetes.io/part-of: retail-reliability-lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: retail-registry
  labels:
    app.kubernetes.io/name: retail-registry
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: retail-registry
  labels:
    app.kubernetes.io/name: retail-registry
    app.kubernetes.io/part-of: retail-reliability-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: retail-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retail-registry
        app.kubernetes.io/part-of: retail-reliability-lab
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
        - name: registry
          image: docker.io/library/registry@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_HTTP_ADDR
              value: 192.168.88.3:5000
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /certs/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /certs/tls.key
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: registry-http-secret
                  key: secret
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: none
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
            - name: registry-tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: registry-data
        - name: registry-tls
          secret:
            secretName: registry-tls
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: retail-registry
  labels:
    app.kubernetes.io/name: retail-registry
    app.kubernetes.io/part-of: retail-reliability-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: retail-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      protocol: TCP
