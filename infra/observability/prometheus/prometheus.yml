global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager.observability.svc.cluster.local:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter.observability.svc.cluster.local:9115]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager.observability.svc.cluster.local:9093]

  - job_name: kube-state-metrics
    static_configs:
      - targets: [kube-state-metrics.observability.svc.cluster.local:8080]

  # Stage 7: scrape application-native metrics from annotated
  # Retail Pods. Discovery itself is restricted to the retail namespace.
  - job_name: retail-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - retail
    relabel_configs:
      - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_scrape
        action: keep
        regex: "true"

      - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_path
        action: replace
        target_label: __metrics_path__
        regex: (.+)

      - source_labels:
          - __meta_kubernetes_pod_ip
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        action: replace
        separator: ";"
        regex: (.+);(\d+)
        replacement: ${1}:${2}
        target_label: __address__

      - source_labels:
          - __meta_kubernetes_namespace
        target_label: namespace

      - source_labels:
          - __meta_kubernetes_pod_name
        target_label: pod

      - source_labels:
          - __meta_kubernetes_pod_label_app_kubernetes_io_name
        target_label: app

  # Stage 7 lab limitation:
  # kubelet serving certificates are node-specific and their observed SANs
  # do not contain the InternalIP addresses used for scraping.
  - job_name: kubelet-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    kubernetes_sd_configs:
      - role: node
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - source_labels:
          - __meta_kubernetes_node_address_InternalIP
        action: replace
        regex: (.+)
        replacement: ${1}:10250
        target_label: __address__

      - source_labels:
          - __meta_kubernetes_node_name
        target_label: node

  - job_name: argocd-application-controller
    static_configs:
      - targets: [argocd-metrics.argocd.svc.cluster.local:8082]

  - job_name: argocd-server
    static_configs:
      - targets: [argocd-server-metrics.argocd.svc.cluster.local:8083]

  - job_name: argocd-repo-server
    static_configs:
      - targets: [argocd-repo-server.argocd.svc.cluster.local:8084]

  - job_name: retail-ui-nodeport
    metrics_path: /probe
    scrape_interval: 30s
    scrape_timeout: 15s
    params:
      module: [http_200]
    static_configs:
      - targets: ['http://192.168.88.5:32065/']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.observability.svc.cluster.local:9115
