apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - deployment.yaml
  - service.yaml
  - blackbox-deployment.yaml
  - blackbox-service.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: blackbox-config
    files:
      - blackbox.yml
