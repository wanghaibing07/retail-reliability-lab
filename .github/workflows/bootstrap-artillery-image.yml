name: Bootstrap Artillery Image

on:
  push:
    branches:
      - fix/stage7-artillery-image-supply

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Mirror Artillery 2.0.22
        run: |
          set -euo pipefail

          SOURCE='docker.io/artilleryio/artillery:2.0.22'
          DEST='ghcr.io/${{ github.repository_owner }}/retail-reliability-lab-artillery:2.0.22'

          docker pull --platform linux/amd64 "$SOURCE"
          docker tag "$SOURCE" "$DEST"
          docker push "$DEST"

          echo "source=${SOURCE}"
          echo "destination=${DEST}"

          docker image inspect "$SOURCE" \
            --format 'source_id={{.Id}} source_digest={{index .RepoDigests 0}}'

          docker image inspect "$DEST" \
            --format 'dest_id={{.Id}}'
