name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Bash syntax
        run: |
          for file in scripts/*.sh tests/*.sh; do
            echo "Checking ${file}"
            bash -n "${file}"
          done

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Test image tag policy
        run: ./tests/test-check-image-tags.sh

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.28.2/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Verify vendored Argo CD manifest
        run: |
          cd infra/argocd/platform/vendor/argocd-v3.5.2
          sha256sum -c install.yaml.sha256

      - name: Render Kustomize manifests
        run: |
          kubectl kustomize infra/apps/retail \
            > /tmp/retail-rendered.yaml

          kubectl kustomize infra/argocd/platform \
            > /tmp/argocd-platform-rendered.yaml

          test -s /tmp/retail-rendered.yaml
          test -s /tmp/argocd-platform-rendered.yaml

          echo "Retail resources:"
          grep '^kind:' /tmp/retail-rendered.yaml \
            | sort \
            | uniq -c

          echo "Argo CD platform resources:"
          grep '^kind:' /tmp/argocd-platform-rendered.yaml \
            | sort \
            | uniq -c

      - name: Install kubeconform
        run: |
          curl -L \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Check Argo CD CRDs
        run: |
          for crd in             applications.argoproj.io             appprojects.argoproj.io             applicationsets.argoproj.io; do
            grep -q "name: ${crd}" /tmp/argocd-platform-rendered.yaml || {
              echo "[FAIL] missing CRD: ${crd}"
              exit 1
            }
          done

          echo "[PASS] Expected Argo CD CRDs are present"

      - name: Validate rendered Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.28.0 \
            /tmp/retail-rendered.yaml

          kubeconform \
            -strict \
            -summary \
            -skip CustomResourceDefinition \
            -kubernetes-version 1.28.0 \
            /tmp/argocd-platform-rendered.yaml

      - name: Reject latest image tags
        run: ./scripts/check-image-tags.sh /tmp/retail-rendered.yaml
