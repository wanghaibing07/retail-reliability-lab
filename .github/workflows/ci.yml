name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Bash syntax
        run: |
          for file in scripts/*.sh; do
            echo "Checking ${file}"
            bash -n "${file}"
          done

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.28.2/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Render Kustomize manifests
        run: |
          kubectl kustomize infra/apps/retail \
            > /tmp/retail-rendered.yaml

          test -s /tmp/retail-rendered.yaml

          echo "Rendered resources:"
          grep '^kind:' /tmp/retail-rendered.yaml \
            | sort \
            | uniq -c

      - name: Install kubeconform
        run: |
          curl -L \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate rendered Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.28.0 \
            /tmp/retail-rendered.yaml

      - name: Reject latest image tags
        run: |
          if grep -E '^[[:space:]]*image:.*:latest([[:space:]]|$)' \
            /tmp/retail-rendered.yaml; then
            echo "[FAIL] latest image tag detected"
            exit 1
          fi

          echo "[PASS] No latest image tags"
